spring:
  application:
    name: identity-service

  jpa:
    hibernate:
      ddl-auto: none  # Flyway owns schema management — do not use validate/create-drop

  flyway:
    enabled: false  # Auto-config removed in Boot 4.1 — using manual FlywayConfig

application:
  version: 0.0.1

jwt:
  access-token-expiration: 900000        # 15 min
  refresh-token-expiration: 604800000    # 7 days
  issuer: identity-service

server:
  port: 8081
  servlet:
    context-path: /identity-service

rate-limit:
  login:
    max-attempts: 5
    window-seconds: 300
  register:
    max-attempts: 3
    window-seconds: 3600
  refresh:
    max-attempts: 10
    window-seconds: 300
  forgot-password:
    max-attempts: 3
    window-seconds: 3600

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
