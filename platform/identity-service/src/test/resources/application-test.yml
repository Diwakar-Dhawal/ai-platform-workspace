spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

jwt:
  secret: TestSecretKeyForUnitTestsOnly12345678901234567890
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: identity-service

# High limits so integration tests don't trip the in-memory rate limiter
rate-limit:
  login:
    max-attempts: 10000
    window-seconds: 1
  register:
    max-attempts: 10000
    window-seconds: 1
  refresh:
    max-attempts: 10000
    window-seconds: 1
  forgot-password:
    max-attempts: 10000
    window-seconds: 1
