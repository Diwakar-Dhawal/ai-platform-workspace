spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/**
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

management:
  endpoints:
    web:
      exposure:
        include: gateway,health

logging:
  level:
    org.springframework.cloud.gateway: TRACE