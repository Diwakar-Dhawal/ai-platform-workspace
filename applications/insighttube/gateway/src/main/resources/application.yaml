spring:
  application:
    name: insighttube-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          routes:
            # ── Identity: public routes (no JWT required) ──
            - id: identity-auth-register
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/register
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            - id: identity-auth-login
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/login
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            - id: identity-auth-refresh
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/refresh
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            - id: identity-auth-forgot-password
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/forgot-password
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            - id: identity-auth-reset-password
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/reset-password
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            - id: identity-auth-verify-email
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/verify-email
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            - id: identity-auth-logout
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/logout
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            # ── Identity: protected routes (JWT required) ──
            - id: identity-auth-protected
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/auth/**
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}
                - name: JwtValidation
                  args:
                    secret: ${jwt.secret}
                    issuer: ${jwt.issuer}

            - id: identity-users
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/users/**
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}
                - name: JwtValidation
                  args:
                    secret: ${jwt.secret}
                    issuer: ${jwt.issuer}

            - id: identity-clients
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/clients/**
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}
                - name: JwtValidation
                  args:
                    secret: ${jwt.secret}
                    issuer: ${jwt.issuer}

            - id: identity-roles
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/roles/**
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}
                - name: JwtValidation
                  args:
                    secret: ${jwt.secret}
                    issuer: ${jwt.issuer}

            # ── Health (no auth) ──
            - id: identity-health
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/health
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}

            # ── Identity: catch-all (JWT required) ──
            - id: identity-catchall
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/identity/**
              filters:
                - RewritePath=/api/v1/identity/(?<segment>.*), /identity-service/${segment}
                - name: JwtValidation
                  args:
                    secret: ${jwt.secret}
                    issuer: ${jwt.issuer}

server:
  port: 8080

jwt:
  secret: ${IDENTITY_JWT_SECRET:ThisIsAVeryLongDevelopmentSecretKey12345678901234567890}
  issuer: identity-service

management:
  endpoints:
    web:
      exposure:
        include: gateway,health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.aiservice.applications.insighttube.gateway: DEBUG
