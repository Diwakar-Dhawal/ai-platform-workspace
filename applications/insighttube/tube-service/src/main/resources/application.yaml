spring:
  application:
    name: tube-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tube_service?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

server:
  port: 8082
  servlet:
    context-path: /tube-service

# External service URLs
services:
  transcript-service:
    url: ${TRANSCRIPT_SERVICE_URL:http://localhost:8085}
  ai-platform:
    url: ${AI_PLATFORM_URL:http://localhost:8084/ai-platform}
  ai-platform-secret: ${AI_PLATFORM_SECRET:}

# JWT validation — secret MUST be set via IDENTITY_JWT_SECRET env var
jwt:
  secret: ${IDENTITY_JWT_SECRET}
  issuer: identity-service

springdoc:
  api-docs:
    path: /tube-service/v3/api-docs
  swagger-ui:
    path: /tube-service/swagger-ui.html
  packages-to-scan: com.aiservice.applications.insighttube.tubeservice.controller

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.aiservice.applications.insighttube.tubeservice: INFO
