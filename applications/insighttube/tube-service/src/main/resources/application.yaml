spring:
  application:
    name: tube-service

  jpa:
    hibernate:
      ddl-auto: none  # Flyway owns schema management

  flyway:
    enabled: false  # Auto-config removed in Boot 4.1 — using manual FlywayConfig

server:
  port: 8082
  servlet:
    context-path: /tube-service

# JWT validation (tokens issued by Identity Service)
jwt:
  secret: ${IDENTITY_JWT_SECRET:ThisIsAVeryLongDevelopmentSecretKey12345678901234567890}
  issuer: identity-service

springdoc:
  api-docs:
    path: /tube-service/v3/api-docs
  swagger-ui:
    path: /tube-service/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    org.flywaydb: DEBUG
    com.aiservice.applications.insighttube.tubeservice: DEBUG
