spring:
  application:
    name: tube-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tube_service?options=-c%20TimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

server:
  port: 8082
  servlet:
    context-path: /tube-service

# External service URLs
services:
  transcript-service:
    url: ${TRANSCRIPT_SERVICE_URL:http://localhost:8085}
  ai-platform:
    url: ${AI_PLATFORM_URL:http://localhost:8084/ai-platform}

# JWT validation
jwt:
  secret: ${IDENTITY_JWT_SECRET:ThisIsAVeryLongDevelopmentSecretKey12345678901234567890}
  issuer: identity-service

springdoc:
  api-docs:
    path: /tube-service/v3/api-docs
  swagger-ui:
    path: /tube-service/swagger-ui.html

logging:
  level:
    com.aiservice.applications.insighttube.tubeservice: DEBUG
