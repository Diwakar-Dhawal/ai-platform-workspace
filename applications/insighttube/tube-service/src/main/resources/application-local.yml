spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${TUBE_DB_URL:jdbc:postgresql://localhost:5432/tube_service?currentSchema=public&sessionVariables=timezone%3DUTC}
    username: ${TUBE_DB_USERNAME:postgres}
    password: ${TUBE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
